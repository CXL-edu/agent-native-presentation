<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" data-port-layout="horizontal-pipeline" data-arrow-gap="10" data-arrow-head-length="14" data-arrow-head-width="16" role="img" aria-labelledby="title desc">
  <title id="title">One-shot presentation workflow</title>
  <desc id="desc">Five stages transform source material into a grounded, rendered, inspected visual artifact. Each stage appears after its incoming connector.</desc>
  <rect width="980" height="300" rx="18" fill="#edf2f7"/>
  <g fill="none" stroke="#0a7ea4" stroke-width="4" stroke-linecap="round">
    <g class="draw-segment" data-edge="source:out->ground:in" style="--motion-delay:.55s;--motion-duration:.55s"><path class="draw-path" data-edge-shaft pathLength="1" d="M164 150H188"/><path class="arrow-head fade-in" data-edge-head style="--motion-delay:1.12s;--motion-duration:.18s" d="M202 142L188 150L202 158Z" fill="#0a7ea4"/></g>
    <g class="draw-segment" data-edge="ground:out->story:in" style="--motion-delay:1.75s;--motion-duration:.55s"><path class="draw-path" data-edge-shaft pathLength="1" d="M356 150H380"/><path class="arrow-head fade-in" data-edge-head style="--motion-delay:2.32s;--motion-duration:.18s" d="M394 142L380 150L394 158Z" fill="#0a7ea4"/></g>
    <g class="draw-segment" data-edge="story:out->render:in" style="--motion-delay:2.95s;--motion-duration:.55s"><path class="draw-path" data-edge-shaft pathLength="1" d="M548 150H572"/><path class="arrow-head fade-in" data-edge-head style="--motion-delay:3.52s;--motion-duration:.18s" d="M586 142L572 150L586 158Z" fill="#0a7ea4"/></g>
    <g class="draw-segment" data-edge="render:out->qa:in" style="--motion-delay:4.15s;--motion-duration:.55s"><path class="draw-path" data-edge-shaft pathLength="1" d="M740 150H764"/><path class="arrow-head fade-in" data-edge-head style="--motion-delay:4.72s;--motion-duration:.18s" d="M778 142L764 150L778 158Z" fill="#0a7ea4"/></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g class="fade-in" data-node="source" data-box="20 98 144 104" style="--motion-delay:0s;--motion-duration:.5s" transform="translate(20 98)"><rect width="144" height="104" rx="14" fill="#fff" stroke="#d7e0e8"/><circle cx="28" cy="30" r="9" fill="#f18f3b"/><text x="86" y="37" font-size="18" font-weight="700" fill="#102033">Source</text><text x="72" y="66" font-size="13" fill="#4f6072">files · data</text><text x="72" y="84" font-size="13" fill="#4f6072">repos · papers</text></g>
    <g class="fade-in" data-node="ground" data-box="212 98 144 104" style="--motion-delay:1.3s;--motion-duration:.5s" transform="translate(212 98)"><rect width="144" height="104" rx="14" fill="#fff" stroke="#d7e0e8"/><circle cx="28" cy="30" r="9" fill="#0a7ea4"/><text x="86" y="37" font-size="18" font-weight="700" fill="#102033">Ground</text><text x="72" y="66" font-size="13" fill="#4f6072">claims</text><text x="72" y="84" font-size="13" fill="#4f6072">sources</text></g>
    <g class="fade-in" data-node="story" data-box="404 98 144 104" style="--motion-delay:2.6s;--motion-duration:.5s" transform="translate(404 98)"><rect width="144" height="104" rx="14" fill="#fff" stroke="#d7e0e8"/><circle cx="28" cy="30" r="9" fill="#25855a"/><text x="86" y="37" font-size="18" font-weight="700" fill="#102033">Story</text><text x="72" y="66" font-size="13" fill="#4f6072">thesis</text><text x="72" y="84" font-size="13" fill="#4f6072">outline</text></g>
    <g class="fade-in" data-node="render" data-box="596 98 144 104" style="--motion-delay:3.9s;--motion-duration:.5s" transform="translate(596 98)"><rect width="144" height="104" rx="14" fill="#fff" stroke="#d7e0e8"/><circle cx="28" cy="30" r="9" fill="#b97916"/><text x="86" y="37" font-size="18" font-weight="700" fill="#102033">Render</text><text x="72" y="66" font-size="13" fill="#4f6072">HTML</text><text x="72" y="84" font-size="13" fill="#4f6072">SVG · PDF</text></g>
    <g class="fade-in" data-node="qa" data-box="788 98 144 104" style="--motion-delay:5.2s;--motion-duration:.5s" transform="translate(788 98)"><rect width="144" height="104" rx="14" fill="#fff" stroke="#d7e0e8"/><circle cx="28" cy="30" r="9" fill="#b64b54"/><text x="86" y="37" font-size="18" font-weight="700" fill="#102033">QA</text><text x="72" y="66" font-size="13" fill="#4f6072">layout</text><text x="72" y="84" font-size="13" fill="#4f6072">grounding</text></g>
  </g>
</svg>
